name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://pm_app:pm_app@localhost:5432/pm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contratos de entrypoint, start e release (sem banco)
        run: python -m unittest discover -s scripts/tests -p 'test_release_contract.py' -v
      - name: Role comum (sem superuser/BYPASSRLS) para a RLS valer
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE pm_app LOGIN PASSWORD 'pm_app' NOSUPERUSER NOBYPASSRLS CREATEDB;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE pm OWNER pm_app;"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q plataforma core setup
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py pm_rls_status --strict
      - run: python manage.py test
