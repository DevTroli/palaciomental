<div class="tenant-form-field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
  {% if field.errors %}<div id="{{ field.auto_id }}_error" class="tenant-form-error" role="alert">{% for error in field.errors %}<span>{{ error }}</span>{% endfor %}</div>{% endif %}
</div>
