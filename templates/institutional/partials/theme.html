{% load static %}
<style>:root{
--tenant-primary:{{ tenant_primary_color }};--tenant-primary-text:{{ tenant_primary_text_color }};
--tenant-solid:{{ tenant_solid_color }};--tenant-selection:{{ tenant_selection_color }};--tenant-selection-text:{{ tenant_selection_text_color }};
--tenant-secondary:{{ tenant_secondary_color }};--tenant-secondary-text:{{ tenant_secondary_text_color }};
--tenant-accent:{{ tenant_accent_color }};--tenant-accent-text:{{ tenant_accent_text_color }};
--tenant-background:{{ tenant_background_color }};--tenant-ink:{{ tenant_background_text_color }};
--tenant-surface:{{ tenant_surface_color }};--tenant-surface-ink:{{ tenant_surface_text_color }};
--tenant-link:{{ tenant_link_color }};--tenant-surface-link:{{ tenant_surface_link_color }};
--tenant-secondary-surface:{{ tenant_secondary_surface_color }};
--tenant-muted:var(--tenant-ink);--tenant-border:color-mix(in srgb,var(--tenant-ink) 25%,transparent);
--pm-purple:var(--tenant-primary);--pm-purple-2:var(--tenant-secondary);--pm-green:var(--tenant-accent);
--pm-green-dark:var(--tenant-accent);--pm-cream:var(--tenant-background);
}</style>
<link rel="stylesheet" href="{% static 'css/tenant-theme.css' %}">
