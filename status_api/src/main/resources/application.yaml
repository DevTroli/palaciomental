spring:
  flyway:
    enabled: false
  application:
    name: status-api
  task:
    scheduling:
      pool:
        size: 2

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

django:
  app:
    url: ${DJANGO_APP_URL:http://django:8000}

monitor:
  enabled: ${STATUS_MONITOR_ENABLED:false}

alerts:
  discord-webhook: ${STATUS_ALERT_DISCORD_WEBHOOK:}
  resend-key: ${RESEND_API_KEY:}
  email-from: ${DEFAULT_FROM_EMAIL:}
  email-to: ${STATUS_ALERT_EMAIL_TO:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /docs
