services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  database:
    image: "postgres:18.6-alpine"
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 usa /var/lib/postgresql como volume (dados em 18/docker).
      - pgdata18:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
    # Desenvolvimento: autoreload. Produção usa o CMD do Dockerfile (gunicorn).
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/1
      STATUS_API_URL: http://status-api:8080/v1/status
      GUARDIAO_API_URL: ""
      GUARDIAO_LOCAL_HTTP: "true"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: dev@localhost
      PM_RLS_STRICT: "true"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/pronto')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - .:/app

  guardiao_migrate:
    build:
      context: ./status_api
      target: migrate
    env_file:
      - .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export GUARDIAO_MIGRATION_JDBC_URL="jdbc:postgresql://database:5432/$${POSTGRES_DB}"
        export GUARDIAO_MIGRATION_USER="$${POSTGRES_USER}"
        export GUARDIAO_MIGRATION_PASSWORD="$${POSTGRES_PASSWORD}"
        exec ./mvnw --batch-mode flyway:migrate flyway:validate
    depends_on:
      database:
        condition: service_healthy

  status_api:
    build:
      context: ./status_api
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: guardiao-local
      SWAGGER_ENABLED: "true"
      DJANGO_APP_URL: http://django:8000
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GUARDIAO_SAFE_BROWSING_KEY: ""
    networks:
      default:
        aliases:
          - status-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v1/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy
      guardiao_migrate:
        condition: service_completed_successfully

  guardiao_worker:
    build:
      context: .
    entrypoint: ["python", "-u"]
    command: ["manage.py", "enviar_links_guardiao", "--continuo"]
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "true"
      REDIS_URL: redis://redis:6379/1
      STATUS_API_URL: http://status-api:8080/v1/status
      GUARDIAO_API_URL: ""
      GUARDIAO_LOCAL_HTTP: "true"
      PM_RLS_STRICT: "true"
    depends_on:
      django:
        condition: service_healthy
      status_api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redisdata:
  pgdata18:
