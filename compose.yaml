services:
  database:
    image: "postgres:18.6-alpine"
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 usa /var/lib/postgresql como volume (dados em 18/docker).
      - pgdata18:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  django:
    build:
      context: .
    # Desenvolvimento: autoreload. Produção usa o CMD do Dockerfile (gunicorn).
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - .:/app

  status_api:
    build:
      context: ./status_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      django:
        condition: service_healthy

volumes:
  pgdata18:
